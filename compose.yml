services:
  builder:
    container_name: builder
    build:
      context: .
    env_file: .env
    volumes:
      - ./dist:/app/dist
  web:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./dist:/usr/share/nginx/html
    depends_on:
      builder:
        condition: service_completed_successfully
    restart: always
